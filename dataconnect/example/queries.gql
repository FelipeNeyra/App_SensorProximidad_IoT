mutation CreateSensor @auth(level: USER) {
  sensor_insert(data: {
    type: "Temperature",
    status: "Online",
    lastPingAt_expr: "request.time",
    batteryLevel: 100
  })
}

mutation UpdateSensor($id: UUID!, $status: String) @auth(level: USER) {
  sensor_update(id: $id, data: { status: $status })
}

mutation DeleteSensor($id: UUID!) @auth(level: USER) {
  sensor_delete(id: $id)
}

query GetSensor($id: UUID!) @auth(level: USER) {
  sensor(id: $id) { type status lastPingAt batteryLevel }
}

query ListSensors @auth(level: USER) {
  sensors { type status }
}